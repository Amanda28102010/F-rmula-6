<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Lab. de Ciências</title>

    <!-- Importando ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Importando o CSS separado -->
    <link rel="stylesheet" href="index.css">

    <!-- Importando a biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header class="admin-header">
        <h1><i class="fas fa-user-shield"></i> Painel do Administrador</h1>
        <div class="admin-stats">
            <span><i class="fas fa-calendar-week"></i> Semana: <span class="count" id="weekCount">0</span></span>
            <span><i class="fas fa-exclamation-triangle"></i> Quebras: <span class="count"
                    id="breakCount">0</span></span>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-add" onclick="carregarDados()"><i class="fas fa-sync-alt"></i> Atualizar</button>
            <button class="btn-add" style="background-color: #dc3545;" onclick="restaurarSistema()"><i
                    class="fas fa-undo-alt"></i> Restaurar Geral</button>
        </div>
    </header>

    <div class="dashboard-grid">

        <!-- 1. Histórico de Fotos -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-camera" style="color: var(--primary-dark);"></i> Histórico de Fotos</h2>
                <span class="badge badge-success">Aulas de Hoje</span>
            </div>
            <div class="card-body" id="photoHistoryList"></div>
        </div>

        <!-- 2. Histórico de Quebras -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-tools" style="color: var(--danger);"></i> Histórico de Quebras</h2>
                <span class="badge badge-danger">Pendentes</span>
            </div>
            <div class="card-body" id="breakHistoryList"></div>
        </div>

        <!-- 3. Histórico Semanal -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-calendar-alt" style="color: var(--primary-light);"></i> Histórico Semanal</h2>
                <span class="badge badge-warning">Últimos 7 dias</span>
            </div>
            <div class="card-body" id="weeklyHistoryList"></div>
        </div>

        <!-- 4. MATERIAIS -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-flask" style="color: #28a745;"></i> Materiais</h2>
                <span class="badge badge-success">Inventário Atual</span>
            </div>
            <div class="card-body" id="materiaisList"></div>
        </div>

    </div>

    <!-- Importando o JavaScript separado -->
    <script src="index.js"></script>
</body>

</html>
